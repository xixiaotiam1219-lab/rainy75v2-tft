<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留白电台 · 屏幕控制</title><style>body{font:15px/1.8 system-ui,"Microsoft YaHei",sans-serif;background:#fff1f6;color:#754258;max-width:720px;margin:44px auto;padding:0 24px}h1{font-size:28px;font-weight:600;margin-bottom:3px}p{color:#9e7b8d}section{background:#fffbfd;border:1px solid #e4bfd1;border-radius:15px;padding:22px;margin:18px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;padding:8px 16px;border:1px solid #cfa6bb;border-radius:8px;color:inherit;background:#fff5fa;cursor:pointer}button.active{background:#a35479;color:white}h2{font-size:20px;margin:4px 0}#line{font-size:23px;color:#a35479;text-align:center;padding:20px 0 4px}#next{color:#b994a6;text-align:center}input[type=range]{width:100%;accent-color:#a35479}.small{font-size:12px;color:#a78596}#error{color:#ad516a;white-space:pre-wrap}a{color:inherit}label{display:block;margin:14px 0 5px}</style><h1>留白电台</h1><p>Ctrl＋F8 切换键盘的按键面板与歌词界面。</p><section><div id="status">正在读取后台状态…</div><h2 id="title">播放器</h2><div id="line">等待播放音乐</div><div id="next"></div><p id="progress"></p><div class="row"><button id="player">歌词界面</button><button id="keys">按键面板</button></div><p id="hotkey" class="small"></p><div id="error"></div></section><section><label for="offset">歌词同步偏移 <span id="offsetValue">0 ms</span></label><input id="offset" type="range" min="-3000" max="3000" step="100" value="0"><p class="small">正值让歌词提前，负值让歌词延后；歌曲播放进度保持实际时间。</p><label for="lrc">为当前曲目导入本地 LRC</label><input id="lrc" type="file" accept=".lrc,text/plain"><p class="small">文件只在本机处理。平时无需保持本页打开，后台会继续同步。</p></section><p class="small">歌词页不显示角色；切回按键面板后保留默认机器人。开机启动与退出可在下方管理。</p><div class="row"><button id="startup">启用登录自启</button><button id="noStartup">取消登录自启</button><button id="stop">退出后台</button></div><p id="notice" class="small"></p><script>
const $=s=>document.querySelector(s);async function post(path,body={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d;}
$('#player').onclick=()=>post('/mode',{mode:1}).catch(e=>$('#notice').textContent=e.message);$('#keys').onclick=()=>post('/mode',{mode:0}).catch(e=>$('#notice').textContent=e.message);
let offset=0;function showOffset(value){offset=value;$('#offset').value=value;$('#offsetValue').textContent=value===0?'0.0 秒':(value>0?'提前 ':'延后 ')+(Math.abs(value)/1000).toFixed(1)+' 秒';if($('#offsetNumber'))$('#offsetNumber').value=(value/1000).toFixed(1);}
async function saveOffset(value){value=Math.max(-10000,Math.min(10000,Math.round(value/100)*100));try{await post('/settings',{offsetMs:value});showOffset(value);$('#notice').textContent='歌词偏移已保存。';}catch(e){$('#notice').textContent=e.message;}}
$('#offset').min=-10000;$('#offset').max=10000;$('#offset').onchange=e=>saveOffset(Number(e.target.value));$('#offset').oninput=e=>showOffset(Number(e.target.value));
const adjust=document.createElement('div');adjust.className='row';adjust.innerHTML='<button id="later">延后 0.5 秒</button><button id="earlier">提前 0.5 秒</button><button id="resetOffset">恢复默认</button><label style="margin:0">偏移（秒） <input id="offsetNumber" type="number" min="-10" max="10" step="0.1" value="0" style="width:74px;font:inherit;color:inherit"></label>';$('#offset').after(adjust);
$('#later').onclick=()=>saveOffset(offset-500);$('#earlier').onclick=()=>saveOffset(offset+500);$('#resetOffset').onclick=()=>saveOffset(0);$('#offsetNumber').onchange=e=>{const value=Number(e.target.value);if(Number.isFinite(value))saveOffset(value*1000);};
const source=document.createElement('p');source.id='lyricSource';source.className='small';$('#progress').after(source);const retry=document.createElement('button');retry.textContent='重新匹配歌词';retry.onclick=()=>post('/retry').then(()=>$('#notice').textContent='正在重新匹配当前歌曲。').catch(e=>$('#notice').textContent=e.message);$('#keys').after(retry);
$('#lrc').onchange=async e=>{const f=e.target.files[0];if(f)try{await post('/lrc',{text:await f.text()});$('#notice').textContent='已为当前曲目载入本地歌词。';}catch(err){$('#notice').textContent=err.message;}};
$('#startup').onclick=()=>post('/startup',{enabled:true}).then(()=>$('#notice').textContent='已启用 Windows 登录自启。').catch(e=>$('#notice').textContent=e.message);$('#noStartup').onclick=()=>post('/startup',{enabled:false}).then(()=>$('#notice').textContent='已取消登录自启。');$('#stop').onclick=()=>post('/stop').then(()=>$('#notice').textContent='后台已退出。');
const stamp=ms=>Math.floor(ms/60000)+':'+String(Math.floor(ms/1000)%60).padStart(2,'0');async function poll(){try{const r=await fetch('/state'),s=await r.json();$('#status').textContent=s.demo?'离线演示 · 未连接硬件':s.connected?'屏幕已连接 · '+(s.music.source?.toLowerCase().includes('qqmusic')?'QQ 音乐':s.music.source?'网易云音乐':'等待播放器'):'等待 USB 键盘';$('#title').textContent=s.frame.title;$('#line').textContent=s.frame.current;$('#next').textContent=s.frame.next;$('#progress').textContent=stamp(s.frame.positionMs)+' / '+stamp(s.frame.durationMs);$('#player').classList.toggle('active',s.wantedMode===1);$('#keys').classList.toggle('active',s.wantedMode===0);$('#hotkey').textContent=s.hotkey.ready?'全局快捷键 Ctrl＋F8 已启用':s.hotkey.error||'正在注册快捷键';$('#error').textContent=s.error||s.music.error||'';const m=s.music.match,p=s.music.lyricProvider;$('#lyricSource').textContent=s.music.loading?'正在匹配同版本歌词…':m?'歌词来源：'+(p.startsWith('qq')?'QQ 音乐':'网易云音乐')+(p.endsWith('-match')?' · 跨平台版本匹配':'')+' · '+m.title+' / '+m.artist+(m.durationMs?' · '+stamp(m.durationMs):''):p==='local'?'歌词来源：本地 LRC':'';if(document.activeElement!==$('#offset')&&document.activeElement!==$('#offsetNumber'))showOffset(s.settings.offsetMs);}catch{$('#status').textContent='后台未运行';}setTimeout(poll,1000);}poll();
</script></html>

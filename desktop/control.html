<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留白电台 · 屏幕控制</title><style>body{font:15px/1.8 system-ui,"Microsoft YaHei",sans-serif;background:#fff1f6;color:#754258;max-width:720px;margin:44px auto;padding:0 24px}h1{font-size:28px;font-weight:600;margin-bottom:3px}p{color:#9e7b8d}section{background:#fffbfd;border:1px solid #e4bfd1;border-radius:15px;padding:22px;margin:18px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;padding:8px 16px;border:1px solid #cfa6bb;border-radius:8px;color:inherit;background:#fff5fa;cursor:pointer}button.active{background:#a35479;color:white}h2{font-size:20px;margin:4px 0}#line{font-size:23px;color:#a35479;text-align:center;padding:20px 0 4px}#next{color:#b994a6;text-align:center}input[type=range]{width:100%;accent-color:#a35479}.small{font-size:12px;color:#a78596}#error{color:#ad516a;white-space:pre-wrap}a{color:inherit}label{display:block;margin:14px 0 5px}</style><h1>留白电台</h1><p>Ctrl＋F8 循环切换：按键页 → 原版双行 → 04 大字字幕 → 大字聚焦 → 双行大字 → 沉浸封面。</p><section><div id="status">正在读取后台状态…</div><h2 id="title">播放器</h2><div id="line">等待播放音乐</div><div id="next"></div><p id="progress"></p><div class="row"><button id="player">歌词界面</button><button id="keys">按键面板</button></div><p id="hotkey" class="small"></p><div id="error"></div></section><section><label for="offset">歌词同步偏移 <span id="offsetValue">0 ms</span></label><input id="offset" type="range" min="-3000" max="3000" step="100" value="0"><p class="small">正值让歌词提前，负值让歌词延后；歌曲播放进度保持实际时间。</p><label for="lrc">为当前曲目导入本地 LRC</label><input id="lrc" type="file" accept=".lrc,text/plain"><p class="small">文件只在本机处理。平时无需保持本页打开，后台会继续同步。</p></section><p class="small">歌词页不显示角色；切回按键面板后保留默认机器人。开机启动与退出可在下方管理。</p><div class="row"><button id="startup">启用登录自启</button><button id="noStartup">取消登录自启</button><button id="stop">退出后台</button></div><p id="notice" class="small"></p><script>
const $=s=>document.querySelector(s);async function post(path,body={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d;}
$('#player').onclick=()=>post('/mode',{mode:1}).catch(e=>$('#notice').textContent=e.message);$('#keys').onclick=()=>post('/mode',{mode:0}).catch(e=>$('#notice').textContent=e.message);
const layouts=[['layout20',0,'原版双行 · 20px'],['layout40',1,'04 大字字幕 · 40px'],['layoutFocus',2,'大字聚焦 · 当前句＋下一句'],['layoutDouble',3,'双行大字 · 自动分页'],['layoutCover',4,'沉浸封面 · 雾面渐变']];
const layoutSection=document.createElement('section');layoutSection.innerHTML='<h2>播放器模板</h2><div class="row">'+layouts.map(([id,value,label])=>'<button id="'+id+'">'+label+'</button>').join('')+'<button id="nextLayout">下一页 · Ctrl＋F8</button></div><p id="fontInfo" class="small">共用原版 Noto CJK 20px 字库，40px 由屏内整数 2 倍绘制。选择会自动保存，切换不重传字库。沉浸封面随当前媒体封面取色，隐藏时间与电量；只传临时小图，不写素材文件。</p><p id="coverStatus" class="small"></p>';$('#offset').closest('section').before(layoutSection);
for(const [id,value]of layouts)$('#'+id).onclick=()=>post('/layout',{layout:value}).then(()=>$('#notice').textContent='播放器模板已保存。').catch(e=>$('#notice').textContent=e.message);
$('#nextLayout').onclick=()=>post('/screen/next').catch(e=>$('#notice').textContent=e.message);
const typeSection=document.createElement('section');typeSection.innerHTML='<h2>沉浸页歌词字体</h2><div class="row"><button id="type20">20px</button><button id="type30">30px</button><button id="type40">40px</button><button id="typeCrisp">清晰</button><button id="typeSoft">柔和</button></div><p class="small">设置自动保存，无需重刷或重传字库；清晰／柔和用于30px。</p>';layoutSection.after(typeSection);
let textSize=30,textStyle=0;const saveType=()=>post('/type',{size:textSize,style:textStyle}).catch(e=>$('#notice').textContent=e.message);for(const n of [20,30,40])$('#type'+n).onclick=()=>{textSize=n;saveType();};$('#typeCrisp').onclick=()=>{textStyle=0;saveType();};$('#typeSoft').onclick=()=>{textStyle=1;saveType();};

const volumeSection=document.createElement('section');volumeSection.innerHTML='<h2>系统音量提示</h2><label><input id="volumeEnabled" type="checkbox" checked> 调整系统音量时显示动画</label><div class="row"><label>位置 <select id="volumeStyle"><option value="0">中央提示 · 短暂遮住歌词</option><option value="1">临时替换进度条</option></select></label><label>范围 <select id="volumeScope"><option value="0">仅沉浸页</option><option value="1">所有页面</option></select></label><label>停留时间 <select id="volumeHold"><option value="600">0.6 秒</option><option value="1000">1 秒</option><option value="1500">1.5 秒</option><option value="2000">2 秒</option><option value="3000">3 秒</option></select></label></div><button id="volumePreview">预览提示（不改变系统音量）</button><p id="volumeStatus" class="small"></p><p class="small">读取 Windows 默认播放设备的真实音量；不监听按键。只发送数值，动画由屏幕生成，无需上传素材。按键页在大键帽内显示，其他歌词页使用中央提示。</p>';typeSection.after(volumeSection);
const saveVolume=()=>post('/volume',{enabled:$('#volumeEnabled').checked,scope:Number($('#volumeScope').value),style:Number($('#volumeStyle').value),holdMs:Number($('#volumeHold').value)}).then(()=>$('#notice').textContent='音量提示设置已保存。').catch(e=>$('#notice').textContent=e.message);
for(const id of ['volumeEnabled','volumeScope','volumeStyle','volumeHold'])$('#'+id).onchange=saveVolume;
$('#volumePreview').onclick=()=>post('/volume/preview').then(()=>$('#notice').textContent='已发送显示预览，系统音量未改变。').catch(e=>$('#notice').textContent=e.message);

let offset=0;function showOffset(value){offset=value;$('#offset').value=value;$('#offsetValue').textContent=value===0?'0.0 秒':(value>0?'提前 ':'延后 ')+(Math.abs(value)/1000).toFixed(1)+' 秒';if($('#offsetNumber'))$('#offsetNumber').value=(value/1000).toFixed(1);}
async function saveOffset(value){value=Math.max(-10000,Math.min(10000,Math.round(value/100)*100));try{await post('/settings',{offsetMs:value});showOffset(value);$('#notice').textContent='歌词偏移已保存。';}catch(e){$('#notice').textContent=e.message;}}
$('#offset').min=-10000;$('#offset').max=10000;$('#offset').onchange=e=>saveOffset(Number(e.target.value));$('#offset').oninput=e=>showOffset(Number(e.target.value));
const adjust=document.createElement('div');adjust.className='row';adjust.innerHTML='<button id="later">延后 0.5 秒</button><button id="earlier">提前 0.5 秒</button><button id="resetOffset">恢复默认</button><label style="margin:0">偏移（秒） <input id="offsetNumber" type="number" min="-10" max="10" step="0.1" value="0" style="width:74px;font:inherit;color:inherit"></label>';$('#offset').after(adjust);
$('#later').onclick=()=>saveOffset(offset-500);$('#earlier').onclick=()=>saveOffset(offset+500);$('#resetOffset').onclick=()=>saveOffset(0);$('#offsetNumber').onchange=e=>{const value=Number(e.target.value);if(Number.isFinite(value))saveOffset(value*1000);};
const source=document.createElement('p');source.id='lyricSource';source.className='small';$('#progress').after(source);const retry=document.createElement('button');retry.textContent='重新匹配歌词';retry.onclick=()=>post('/retry').then(()=>$('#notice').textContent='正在重新匹配当前歌曲。').catch(e=>$('#notice').textContent=e.message);$('#keys').after(retry);
$('#lrc').onchange=async e=>{const f=e.target.files[0];if(f)try{await post('/lrc',{text:await f.text()});$('#notice').textContent='已为当前曲目载入本地歌词。';}catch(err){$('#notice').textContent=err.message;}};
$('#startup').onclick=()=>post('/startup',{enabled:true}).then(()=>$('#notice').textContent='已启用 Windows 登录自启。').catch(e=>$('#notice').textContent=e.message);$('#noStartup').onclick=()=>post('/startup',{enabled:false}).then(()=>$('#notice').textContent='已取消登录自启。');$('#stop').onclick=()=>post('/stop').then(()=>$('#notice').textContent='后台已退出。');
const stamp=ms=>Math.floor(ms/60000)+':'+String(Math.floor(ms/1000)%60).padStart(2,'0');async function poll(){try{const r=await fetch('/state'),s=await r.json();$('#status').textContent=s.demo?'离线演示 · 未连接硬件':s.connected?'屏幕已连接 · '+(s.music.source?.toLowerCase().includes('qqmusic')?'QQ 音乐':s.music.source?'网易云音乐':'等待播放器'):'等待 USB 键盘';$('#title').textContent=s.frame.title;$('#line').textContent=s.frame.current;$('#next').textContent=s.frame.next;$('#progress').textContent=stamp(s.frame.positionMs)+' / '+stamp(s.frame.durationMs);$('#player').classList.toggle('active',s.wantedMode===1);$('#keys').classList.toggle('active',s.wantedMode===0);for(const [id,value]of layouts){$('#'+id).classList.toggle('active',s.settings.layout===value);$('#'+id).disabled=!s.demo&&(!s.connected||value>=s.wire.layoutCount);}$('#nextLayout').disabled=!s.demo&&(!s.connected||!s.wire.layoutSupported);$('#hotkey').textContent=s.hotkey.ready?'全局 Ctrl＋F8 六页循环已启用':s.hotkey.error||'正在注册快捷键';$('#error').textContent=s.error||s.music.error||'';$('#coverStatus').textContent=s.settings.layout===4?(s.wire.coverError||s.artwork?.error||(s.artwork?.loading?'正在读取当前封面…':s.artwork?.ready?'封面已缓存 · '+(s.wire.coverMs||0)+'ms 临时传输':'当前媒体未提供封面')):'';textSize=s.settings.textSize||30;textStyle=s.settings.textStyle||0;for(const n of [20,30,40]){$('#type'+n).classList.toggle('active',textSize===n);$('#type'+n).disabled=!s.demo&&!s.wire.textSupported;}$('#typeCrisp').classList.toggle('active',textStyle===0);$('#typeSoft').classList.toggle('active',textStyle===1);$('#typeCrisp').disabled=$('#typeSoft').disabled=textSize!==30||!s.demo&&!s.wire.textSupported;const vs=s.volume||{},vc=s.demo||s.connected&&s.wire.volumeSupported;$('#volumeEnabled').checked=s.settings.volumeEnabled!==false;$('#volumeScope').value=s.settings.volumeScope||0;$('#volumeStyle').value=s.settings.volumeStyle||0;if(document.activeElement!==$('#volumeHold'))$('#volumeHold').value=s.settings.volumeHoldMs||1000;for(const id of ['volumeEnabled','volumeScope','volumeStyle','volumeHold'])$('#'+id).disabled=!vc;$('#volumePreview').disabled=s.demo||!vc||!vs.available||!s.settings.volumeEnabled;$('#volumeStatus').textContent=s.demo?'离线演示不读取系统音量':!s.connected?'连接屏幕后可用':!s.wire.volumeSupported?'当前屏幕固件缺少音量接口，请更新歌词屏幕固件':vs.error||(!s.settings.volumeEnabled?'音量提示已关闭':vs.available?'当前系统音量 '+vs.level+'%'+(vs.muted?' · 静音':''):'正在读取系统音量…');const m=s.music.match,p=s.music.lyricProvider;$('#lyricSource').textContent=s.music.loading?'正在匹配同版本歌词…':m?'歌词来源：'+(p.startsWith('qq')?'QQ 音乐':'网易云音乐')+(p.endsWith('-match')?' · 跨平台版本匹配':'')+' · '+m.title+' / '+m.artist+(m.durationMs?' · '+stamp(m.durationMs):''):p==='local'?'歌词来源：本地 LRC':'';if(document.activeElement!==$('#offset')&&document.activeElement!==$('#offsetNumber'))showOffset(s.settings.offsetMs);}catch{$('#status').textContent='后台未运行';}setTimeout(poll,1000);}poll();
</script></html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Rainy75 V2 安装</title>
<link rel="stylesheet" href="./easy-install.css">
</head>
<body>
<main>
  <header>Rainy75 V2 <span>屏幕安装</span></header>
  <section class="installation" aria-labelledby="title">
    <div class="info">
      <h1 id="title">屏幕安装</h1>
      <p id="intro">用 USB 连接键盘，切到有线，然后退出 WOBHub。</p>
      <p class="note">安装会替换小屏的第 1 个 GIF 素材。</p>
      <div class="actions">
        <button id="action" type="button" disabled>开始安装</button>
        <button id="background" class="secondary" type="button" hidden>启动歌词同步</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <progress id="progress" max="100" value="0" aria-label="安装进度" hidden></progress>
      <p id="error" role="alert" hidden></p>
      <a id="settings" hidden target="_blank" rel="noopener">歌词设置</a>
    </div>
    <figure>
      <img id="preview" alt="键盘小屏预览" width="320" height="172">
      <figcaption>小屏预览</figcaption>
    </figure>
  </section>
  <details>
    <summary>安装遇到问题</summary>
    <p>浏览器请用 Chrome 或 Edge。看不到设备时，检查数据线和键盘的有线档。</p>
    <p>升级中请保持供电。如果中断后只能选到升级设备，按压缩包里的恢复说明操作。</p>
    <pre id="log" aria-label="安装日志"></pre>
  </details>
  <details id="maintenance" hidden>
    <summary>删除屏内字库</summary>
    <p>删掉字库后，屏幕将无法显示歌词。切换桌宠版前，可在仍装有歌词固件时删除。</p>
    <label for="old-font">使用非本项目附带的字库时，选择原 FONT.BIN</label>
    <input id="old-font" type="file" accept=".bin">
    <button id="remove-font" class="secondary" type="button" disabled>删除字库</button>
  </details>
  <footer>免费项目，严禁倒卖</footer>
</main>
<script type="module" src="./easy-install.mjs"></script>
</body>
</html>
